[workspace]
resolver = "3"

members = [
    "crates/librax-types",
    "crates/librax-config",
    "crates/librax-connectors",
    "crates/librax-normalizer",
    "crates/librax-enrichment",
    "crates/librax-detection",
    "crates/librax-entities",
    "crates/librax-correlation",
    "crates/librax-graph",
    "crates/librax-mitre",
    "crates/librax-risk",
    "crates/librax-incidents",
    "crates/librax-response",
    "crates/librax-storage",
    "crates/librax-ai",
    "services/librax-api",
    "services/librax-simulator",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
librax-types = { path = "crates/librax-types" }
librax-config = { path = "crates/librax-config" }
librax-connectors = { path = "crates/librax-connectors" }
librax-normalizer = { path = "crates/librax-normalizer" }
librax-enrichment = { path = "crates/librax-enrichment" }
librax-detection = { path = "crates/librax-detection" }
librax-entities = { path = "crates/librax-entities" }
librax-correlation = { path = "crates/librax-correlation" }
librax-graph = { path = "crates/librax-graph" }
librax-mitre = { path = "crates/librax-mitre" }
librax-risk = { path = "crates/librax-risk" }
librax-incidents = { path = "crates/librax-incidents" }
librax-response = { path = "crates/librax-response" }
librax-storage = { path = "crates/librax-storage" }
librax-ai = { path = "crates/librax-ai" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"
dashmap = "6"
dotenvy = "0.15"
futures = "0.3"
parking_lot = "0.12"
petgraph = { version = "0.8", features = ["serde-1"] }
redis = { version = "1", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
